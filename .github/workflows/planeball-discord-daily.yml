name: PlaneBall daily Discord leaderboard

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planeball-discord-daily
  cancel-in-progress: false

jobs:
  discord-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install leaderboard dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Validate leaderboard report logic
        run: python -m unittest discover -s tests -p test_planeball_discord.py
      - name: Collect rankings and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/planeball_discord.py
      - name: Save successful snapshot for next comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/planeball_daily.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit'
          else
            git commit -m 'Save daily PlaneBall ladder snapshot'
            git push
          fi
