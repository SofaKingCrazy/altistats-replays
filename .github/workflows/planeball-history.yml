name: PlaneBall public daily ranking history
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planeball-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Run feed tests
        run: python -m unittest discover -s tests -p 'test_planeball_history.py'
      - name: Collect current public rankings
        run: python scripts/collect_planeball_history.py
      - name: Commit rolling public snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/planeball_history.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes'
          else
            git commit -m 'Update public PlaneBall ranking history'
            git push
          fi
