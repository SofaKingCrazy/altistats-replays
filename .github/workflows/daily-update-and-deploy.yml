name: Altistats daily update and site deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: altistats-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Import new games from Altistats
        if: github.event_name != 'push'
        run: python scripts/update_games.py --days 45
      - name: Save updated archive to repository
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/matches.json data/matches.js data/status.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update replay archive'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static website only
        run: |
          mkdir -p public
          cp index.html public/
          cp .nojekyll public/
          cp -R data public/
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Upload collection diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: altistats-collector-diagnostics
          path: debug/
          if-no-files-found: ignore
