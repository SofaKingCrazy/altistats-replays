name: One-time PlaneBall 30-day history backfill
on:
  push:
    paths:
      - '.github/workflows/planeball-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planeball-history
  cancel-in-progress: false

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsing libraries
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Test historical rating and rank reconstruction
        run: python -m unittest discover -s tests -p 'test_planeball_backfill.py'
      - name: Fetch match histories for all currently ranked players
        run: python scripts/backfill_planeball_history.py --days 30 --workers 4
      - name: Commit historical daily data to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/planeball_history.json
          if git diff --cached --quiet; then
            echo 'Nothing new to add'
          else
            git commit -m 'Backfill 30 days of PlaneBall player history'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
